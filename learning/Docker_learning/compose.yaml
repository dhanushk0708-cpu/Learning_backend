services:
  api:
    build: .
    container_name: fastapi-compose
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:apppassword@postgres:5432/appdb
      REDIS_HOST: redis
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:latest
    container_name: redis-compose

  postgres:
    image: postgres:16
    container_name: postgres-compose
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: nginx-compose
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: